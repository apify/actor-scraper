packages:
  - packages/*
  - packages/actor-scraper/*

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  # Renovate security update: turbo@2.9.14
  - turbo@2.9.14

# pnpm 11 replaced the onlyBuiltDependencies allowlist with this boolean map. Every package here
# runs install scripts; anything omitted is an ERR_PNPM_IGNORED_BUILDS failure rather than a warning.
allowBuilds:
  "@playwright/browser-chromium": true
  "@swc/core": true
  better-sqlite3: true
  camoufox-js: true
  esbuild: true
  nx: true
  playwright: true
  puppeteer: true

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true

# Security overrides for transitives whose owner still resolves an affected range. vite reaches us
# through vitest and vite-tsconfig-paths; lerna pins js-yaml and tar to exact vulnerable versions
# (lerna 10 ships patched ones, but that is a major bump of the release tooling). Drop an entry once
# its owner has moved on.
overrides:
  vite: "^7.3.6"
  postcss: "^8.5.25"
  js-yaml: "^4.3.1"
  tar: "^7.5.22"
