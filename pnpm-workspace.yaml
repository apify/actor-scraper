packages:
  - packages/*
  - packages/actor-scraper/*

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  # Renovate security update: turbo@2.9.14
  - turbo@2.9.14

# pnpm 11 replaced the onlyBuiltDependencies allowlist with this boolean map. Every package here
# runs install scripts; anything omitted is an ERR_PNPM_IGNORED_BUILDS failure rather than a warning.
allowBuilds:
  esbuild: true
  nx: true
  # Its postinstall only downloads browsers: images take them from their base, CI and
  # CONTRIBUTING.md install Chrome explicitly.
  puppeteer: false

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true

# Security override for a transitive whose owner still resolves an affected range:
# cosmiconfig@9.0.2 (via commitlint) declares js-yaml ^4.1.0 on its own and would resolve its own
# nested copy back to a 4.x line without this; force it onto the same patched 5.x line lerna uses.
# Drop once cosmiconfig bumps its own js-yaml dependency.
overrides:
  js-yaml: "^5.0.0"
