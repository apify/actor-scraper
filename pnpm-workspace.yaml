packages:
  - packages/*
  - packages/actor-scraper/*

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  # Renovate security update: turbo@2.9.14
  - turbo@2.9.14

# pnpm 11 replaced the onlyBuiltDependencies allowlist with this boolean map. Every package here
# runs install scripts; anything omitted is an ERR_PNPM_IGNORED_BUILDS failure rather than a warning.
allowBuilds:
  esbuild: true
  nx: true
  # Its postinstall only downloads browsers: images take them from their base, CI and
  # CONTRIBUTING.md install Chrome explicitly.
  puppeteer: false

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true

# Security overrides for transitives whose owner still resolves an affected range. lerna 10 now
# pulls a patched tar on its own (dropped that override); cosmiconfig (via commitlint) still
# resolves an older js-yaml line than lerna's, so keep forcing both onto the patched 5.x. Drop an
# entry once its owner has moved on.
#
# (The apify@4.0.0-beta.12>@crawlee/{core,types,utils} overrides that used to force Sitemap
# Extractor's beta deps were dropped by the dependency sweep: sitemap-scraper's own package.json
# already pins those exact beta versions directly, so the override was a no-op.)
overrides:
  js-yaml: "^5.0.0"
