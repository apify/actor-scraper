# git-cliff configuration for the generic scrapers.
#
# Derived from apify/actions/git-cliff-release/cliff.toml with four deliberate deltas:
#
#   1. `chore(deps)` commits are grouped under "Dependencies" instead of being skipped.
#      For these Actors the dependency stack (Crawlee, the SDK, Puppeteer/Playwright, Node)
#      *is* the product - historically the hand-written changelogs contained little else.
#      Bumps of the repo's own tooling are blocklisted; anything unrecognised is shown, so a new
#      runtime dependency reaches the changelog on its own and only a new dev tool needs the
#      list extending.
#
#   2. `tag_pattern` matches the per-Actor tag namespace (`<actor>-v<build number>`).
#      Every Actor has its own version line and is released on its own, so the release
#      workflow rewrites this line to `^<actor>-v` before each run; the value below is
#      only the fallback for running git-cliff by hand.
#
#   3. `filter_commits` is on, making the parsers below an allowlist. See the comment on it.
#
#   4. The grouping parsers only accept commits scoped to this Actor or to work shared by every
#      Actor, so each changelog lists the changes of its own Actor. See the comment on them.
#      Upstream's body-based "Security" parser is dropped: git-cliff applies a parser when any of
#      its fields matches, so it cannot be limited to a scope and would let any commit through.
#

[changelog]
# changelog body will be rendered even if there are no releases to process - required for pre-release version bumps
render_always = true
# changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if not version %}<!-- git-cliff-unreleased-start -->
{% endif %}\
{% if version and extra.release_link %}\
    ## [{{ version | trim_start_matches(pat="v") }}]({{ extra.release_link }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% elif extra.unreleased_version %}\
    ## {{ extra.unreleased_version | trim_start_matches(pat="v") }} - **not yet released**
{% elif version %}
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {% if commit.extra.pr_link %}\
            {{ commit.message | escape | upper_first | replace(from=commit.extra.raw_pr_link, to=commit.extra.pr_link) }}\
            {% else %}\
            {{ commit.message | escape | upper_first }}\
            {% endif %}\
            {% if commit.extra.commit_link %} ([{{ commit.id | truncate(length = 7, end = "") }}]({{ commit.extra.commit_link }})){% endif %}\
            {% if commit.extra.username and extra.is_release_notes %}\
            {{" "}}by @{{ commit.extra.username }}\
            {% elif commit.extra.username %}\
            {{" "}}by [@{{ commit.extra.username }}](https://github.com/{{ commit.extra.username }})\
            {% if commit.extra.closed_issue_links %}\
            , closes {{ commit.extra.closed_issue_links | join(sep = ", ") }}\
            {% endif %}\
            {%- endif %}\
    {% endfor %}
{% endfor %}\n
{% if not version %}<!-- git-cliff-unreleased-end -->
{% endif %}\
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing s
trim = true
# postprocessors
postprocessors = []

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = []
# regex for parsing and grouping commits
commit_parsers = [
    # Only commits scoped to this Actor or to work shared by every Actor are documented. The release
    # workflow replaces the placeholder with both before each run: the Actor's directory and aliases
    # from .github/release-actors.json, plus `generic`, `deps` and `scraper-tools`. Anything else -
    # another Actor's scope, `ci`, `docker`, or no scope at all - matches none of the grouping parsers
    # and is dropped by `filter_commits`. Left unsubstituted, the placeholder matches nothing and every
    # commit is dropped, which the workflow checks for.
    { message = "^(feat|patch)\\((ALLOWED_SCOPES)\\)", group = "<!-- 0 -->🚀 Features" },
    { message = "^(fix|bug)\\((ALLOWED_SCOPES)\\)", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^docs\\((ALLOWED_SCOPES)\\)!:", group = "<!-- 3 -->📚 Documentation" },
    { message = "^docs", skip = true },
    { message = "^perf\\((ALLOWED_SCOPES)\\)", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor\\((ALLOWED_SCOPES)\\)!:", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^refactor", skip = true },
    { message = "^style\\((ALLOWED_SCOPES)\\)!:", group = "<!-- 5 -->🎨 Styling" },
    { message = "^style", skip = true },
    { message = "^test\\((ALLOWED_SCOPES)\\)!:", group = "<!-- 6 -->🧪 Testing" },
    { message = "^test", skip = true },
    { message = "^chore\\(release\\): prepare for", skip = true },
    # Bumps of the repo's own tooling say nothing about the Actor a Store user runs.
    { message = "^chore\\(deps.*\\).*(oxfmt|oxlint|lerna|commitlint|husky|lint-staged|vitest|turbo|tsx|typescript|@types/|renovate|actions/|ubuntu|codecov)", skip = true },
    { message = "^chore\\(deps.*\\)", group = "<!-- 10 -->⬆️ Dependencies" },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^(chore|ci)\\((ALLOWED_SCOPES)\\)!:", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^chore|^ci", skip = true },
    { message = "^build\\((ALLOWED_SCOPES)\\)!:", group = "<!-- 7 -->🏗️ Build" },
    { message = "^build", skip = true },
    { message = "^revert\\((ALLOWED_SCOPES)\\)", group = "<!-- 9 -->◀️ Revert" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
# Off, because the protection would get past the scope allowlist above: a breaking `docs`, `refactor`,
# `style`, `test`, `chore`, `ci` or `build` commit of another Actor matches the skipping parser of its
# type, is protected from it, and lands in every changelog, ungrouped at that - in a bare "Docs"
# section, say. Every skipping parser above is preceded by a rule that groups the `!:` form of the same
# type, so a breaking change still reaches the changelog of the Actor it belongs to.
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
# Upstream keeps these, which is fine for a repo whose history is conventional throughout. Ours goes
# back to 2017 and contains types like `Docs:` and `Readme:`; the parsers below are case-sensitive, so
# those fall through every rule and end up as their own sections on the Actor's Store page. It is also
# what drops a `feat`, `fix`, `perf` or `revert` commit outside the scope allowlist: no parser accepts
# it, so it ends up here.
filter_commits = true
# regex for matching git tags
tag_pattern = "-v[0-9]+\\."
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
# limit the number of commits included in the changelog.
# limit_commits = 42
